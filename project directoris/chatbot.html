<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #root {
            width: 100%;
            max-width: 420px;
        }

        /* Chat container wrapping everything */
        .chat-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            height: 600px;
            overflow: hidden;
        }

        /* Messages scroll area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Individual message row */
        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 80%;
        }

        .message-row.robot {
            align-self: flex-start;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message-row.robot .message-bubble {
            background: #e4e6eb;
            color: #050505;
            border-bottom-left-radius: 4px;
        }

        .message-row.user .message-bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Input area at bottom */
        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
        }

        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .input-area input:focus {
            border-color: #2563eb;
        }

        .input-area button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background: #1d4ed8;
        }
    </style>
    
</head>

            const [inputText, setInputText] = React.useState("");
            function saveInputText(event) {
                setInputText(event.target.value);
            }


            function sendMessage() {

                const newChatMessages = [...chatMessages, { message: inputText, sender: "user" }];

                setChatMessages(newChatMessages);

                const response = Chatbot.getResponse(inputText);
                setChatMessages([...newChatMessages, { message: response, sender: "robot" }]);

                setInputText("");
            }

            return (
                <div className="input-area">
                    <input placeholder="type your message here" size="30" onChange={saveInputText} value={inputText} />
                    <button onClick={sendMessage}>Send</button>

                </div>
            );
        }
